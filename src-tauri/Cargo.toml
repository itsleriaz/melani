[package]
name = "melani"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "melani_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
ulid = { version = "3.0.0", features = ["std"] }
thiserror = "2.0.21"
aho-corasick = "1.1.5"
unicode-normalization = "0.1.26"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
